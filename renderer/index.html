<!-- renderer/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; frame-src *; connect-src * http://localhost:11434 http://127.0.0.1:11434; img-src * data:">
    <title>NormiesOS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@walletconnect/sign-client/dist/index.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="desktop-drag.js"></script>

</head>
<body>

    <!-- WalletConnect QR Modal -->
    <div id="wc-modal">
        <div id="wc-inner">
            <div id="wc-header">
                <span>SCAN WITH METAMASK MOBILE</span>
                <button class="dock-start-btn" id="wc-close" style="padding: 2px 8px;">X</button>
            </div>
            <div id="wc-qr-container"></div>
            <div id="wc-status">Initializing...</div>
        </div>
    </div>

    <!-- Splash Screen (contient aussi la phase alpha build) -->
    <div id="splash-screen">
        <img id="splash-logo" src="https://pbs.twimg.com/profile_images/2048111234621595648/vK-61sKo_400x400.jpg" width="100" height="100" style="image-rendering: pixelated; margin: 0 auto 20px auto; display: block; border-radius: 0; position: relative; top: 30px;" alt="Normies Logo">
        <div id="splash-title" class="splash-title">NormiesOS</div>
        <canvas id="boot-progress-canvas" width="200" height="20" style="display:none;"></canvas>
        <div id="teaser-boot-bar">
            <div class="tp-block"></div>
            <div class="tp-block"></div>
            <div class="tp-block"></div>
            <div class="tp-block"></div>
            <div class="tp-block"></div>
            <div class="tp-block"></div>
            <div class="tp-block"></div>
            <div class="tp-block"></div>
            <div class="tp-block"></div>
            <div class="tp-block"></div>
        </div>
        <button class="splash-connect-btn" id="splash-connect-btn" style="display:none;">[ CONNECT ]</button>
        <button id="dev-skip" style="display:none;margin-top:8px;font-size:10px;opacity:0.4;background:transparent;border:none;color:#e3e5e4;cursor:pointer;font-family:'Courier New',monospace;">[ DEV: 0xb488...7AD1 ]</button>
        <div class="splash-status" id="splash-status"></div>
        <!-- Phase Alpha Build — caché au départ -->
        <canvas id="alpha-canvas" width="40" height="40" style="display:none;width:60vh;height:60vh;image-rendering:pixelated;background-color:#e3e5e4;"></canvas>
        <div id="alpha-build-label" style="display:none;"></div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <canvas id="hive-wallpaper"></canvas>
        <canvas id="mempool-wallpaper"></canvas>
        <img id="desktop-normie" src="" alt="" class="normie-avatar">
        <div id="boot-terminal"></div>
        <div id="desktop-trash" ondblclick="openTrash()" style="position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;z-index:10;width:56px;">
            <div style="position:relative;">
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" style="width:40px;height:40px;fill:#48494b;" shape-rendering="crispEdges"><rect x="6" y="0" width="4" height="1" fill="currentColor"/><rect x="2" y="1" width="12" height="2" fill="currentColor"/><rect x="3" y="3" width="2" height="10" fill="currentColor"/><rect x="11" y="3" width="2" height="10" fill="currentColor"/><rect x="3" y="13" width="10" height="1" fill="currentColor"/><rect x="6" y="3" width="1" height="9" fill="currentColor"/><rect x="9" y="3" width="1" height="9" fill="currentColor"/></svg>
                <div id="trash-badge" style="display:none;position:absolute;top:-4px;right:-4px;background:#48494b;color:#e3e5e4;font-family:'Courier New',monospace;font-size:10px;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 2px;pointer-events:none;"></div>
            </div>
            <span style="font-family:'Courier New',monospace;font-size:10px;color:#48494b;margin-top:2px;letter-spacing:0.5px;">TRASH</span>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <!-- Status Header -->
        <div class="sm-status-header">
            <div class="sm-status-data">
                <div id="sm-agent-name" style="font-size:11px;font-weight:bold;color:#e3e5e4;letter-spacing:1px;margin-bottom:2px;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
                <div id="sm-wallet">-- WALLET --</div>
                <div class="sm-stat-row">
                    <span class="sm-stat-lbl">LVL</span>
                    <div id="sm-level-bits" class="sm-bit-bar">
                        <span class="sm-bit"></span><span class="sm-bit"></span>
                        <span class="sm-bit"></span><span class="sm-bit"></span>
                        <span class="sm-bit"></span><span class="sm-bit"></span>
                    </div>
                    <span id="sm-level-val" class="sm-stat-val">--</span>
                </div>
                <div class="sm-stat-row">
                    <span class="sm-stat-lbl">AP</span>
                    <div id="sm-ap-bar" class="sm-ap-bar"></div>
                    <span id="sm-ap-val" class="sm-stat-val">--</span>
                </div>
                <div class="sm-stat-row" id="sm-prestige-row" style="display:none;">
                    <span class="sm-stat-lbl" style="width:auto;padding-right:6px;">PST</span>
                    <span id="sm-prestige-val" class="sm-stat-val" style="width:auto;">--</span>
                    <span id="sm-agent-count" style="font-size:10px;opacity:0.65;letter-spacing:0.5px;margin-left:4px;"></span>
                </div>
            </div>
            <button id="sm-opensea-btn" style="position:absolute;right:24px;top:16px;background:transparent;border:none;padding:0;display:block;width:48px;height:48px;">
                <img src="opensea.png" style="width:48px;height:48px;image-rendering:pixelated;cursor:pointer;" alt="OpenSea" data-desc="OPEN OPENSEA">
            </button>
        </div>

        <!-- Search bar -->
        <div style="padding:4px 8px;border-bottom:1px dashed rgba(72,73,75,0.3);background:#e3e5e4;">
            <input id="sm-search" type="text" placeholder="SEARCH APPS..." autocomplete="off" spellcheck="false"
                style="width:100%;box-sizing:border-box;border:1px solid rgba(72,73,75,0.3);background:transparent;color:#48494b;font-family:'Courier New',Courier,monospace;font-size:10px;padding:3px 8px;outline:none;letter-spacing:1px;">
        </div>

        <!-- Pinned (hidden if empty) -->
        <div id="sm-pinned-cat" class="sm-pinned-section" style="display:none;">
            <div class="sm-quad-title">[ PINNED ]</div>
            <div id="sm-pinned-list" class="sm-pinned-list"></div>
        </div>

        <!-- Icon Grid -->
        <div id="launcher-apps-grid" class="launcher-apps-grid"></div>
        <div id="launcher-tabs-bar" class="launcher-tabs-bar"></div>

        <div class="sm-footer">
            <button id="disconnect-btn">[ DISCONNECT ]</button>
            <button id="tour-btn">[ TOUR ]</button>
        </div>
    </div>
    <div id="launcher-tooltip"></div>

    <!-- Taskbar -->
    <div id="normie-dock">
        <button class="dock-start-btn" id="start-btn">
            <svg viewBox="0 0 10 10" class="normie-logo" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                <rect x="1" y="3" width="2" height="6" fill="currentColor"/>
                <rect x="3" y="1" width="4" height="2" fill="currentColor"/>
                <rect x="7" y="1" width="2" height="8" fill="currentColor"/>
                <rect x="4" y="5" width="2" height="3" fill="currentColor"/>
            </svg>
        </button>
        <div class="dock-apps" id="dock-apps"></div>
        <div id="systray">
            <span id="mempool-led" title="Mempool heartbeat" style="display:inline-block;width:7px;height:7px;background:#48494b;border:1px solid #e3e5e4;opacity:0.3;vertical-align:middle;margin-right:4px;flex-shrink:0;"></span>
            <span class="systray-item" id="systray-ollama" title="Ollama status">OLLAMA:--</span>
            <span class="systray-item" id="systray-net" title="Network status">WIFI:OK</span>
            <button id="notif-log-btn" title="Notification log" style="position:relative;background:transparent;border:none;padding:2px 4px;cursor:pointer;line-height:0;display:inline-flex;align-items:center;justify-content:center;"><svg viewBox="0 0 16 16" width="14" height="14" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" style="display:block;pointer-events:none;"><rect x="6" y="1" width="4" height="1" fill="#e3e5e4"/><rect x="4" y="2" width="8" height="1" fill="#e3e5e4"/><rect x="3" y="3" width="10" height="5" fill="#e3e5e4"/><rect x="2" y="8" width="12" height="2" fill="#e3e5e4"/><rect x="1" y="10" width="14" height="1" fill="#e3e5e4"/><rect x="6" y="11" width="4" height="2" fill="#e3e5e4"/><rect x="7" y="13" width="2" height="1" fill="#e3e5e4"/></svg><span id="notif-log-badge" style="display:none;position:absolute;top:-5px;right:-5px;background:#48494b;color:#e3e5e4;font-family:'Courier New',monospace;font-size:9px;min-width:13px;height:13px;line-height:13px;text-align:center;padding:0 2px;pointer-events:none;"></span></button>
        </div>
        <div id="notif-log-panel" style="display:none;position:fixed;bottom:40px;right:10px;width:280px;max-height:340px;overflow-y:auto;background:#48494b;color:#e3e5e4;border:1px solid #e3e5e4;font-family:'Courier New',monospace;font-size:10px;z-index:9800;box-sizing:border-box;"></div>
        <div class="dock-clock" id="clock">00:00</div>
    </div>

    <!-- CRT scanlines overlay -->
    <div id="crt-overlay"></div>
    <div id="normie-bubble"></div>

    <script type="module">
        import { showSystemSplash, animateAlphaBuild, initOllamaState } from './boot.js';
        import { APPS } from './apps-registry.js';
        import { MempoolMonitor, showMempoolAlert } from './mempool-monitor.js';
        import { parseNeuralPathway, fetchAgentBinding, fetchHolderTokenIds, fetchAgentsCount, fetchA2AManifest, buildSyntheticA2AManifest } from './normie-api.js';
        window.fetchA2AManifest = fetchA2AManifest;
        window.buildSyntheticA2AManifest = buildSyntheticA2AManifest;
        import { fetchLocalAI, checkOllamaStatus, buildSystemPrompt, applyAgentStatus } from './brain-inspector.js';
        window.fetchLocalAI = fetchLocalAI;
        window.checkOllamaStatus = checkOllamaStatus;
        window.buildSystemPrompt = buildSystemPrompt;
        window.applyAgentStatus = applyAgentStatus;
        import { calculatePrestigeScore, calculateWalletPrestige } from './prestige.js';
        window.calculatePrestigeScore = calculatePrestigeScore;
        import { NormieNotifier } from './core/notifications.js';
        const notifier = new NormieNotifier();
        window._notifier = notifier;
        window.APPS = APPS;
        window.animateAlphaBuild = animateAlphaBuild;
        window.fetchAgentBinding = fetchAgentBinding;
        window.fetchHolderTokenIds = fetchHolderTokenIds;
        window.log = log;
        window.pinAppToDock = pinAppToDock;
        window.unpinAppFromDock = unpinAppFromDock;
        window.getAppType = getAppType;

        // ISO TEST MODE — boot sequence restored
        const WALLET_ADDRESS = ''; // hardcoded wallet removed — user enters address at boot
        // localStorage.setItem('devMode', 'true');

        const { SignClient } = window['@walletconnect/sign-client'];
        const API = 'https://api.normies.art';
        window.API = API;
        window.OLLAMA = 'http://localhost:11434';
        window.NORMIE_VOICE_ENABLED = localStorage.getItem('normie_voice_enabled') === 'true';
        window.activeAlphaGender = 'male';
        window.cacheAlphaGender = function() {
            const id    = window.currentAlphaId;
            const meta  = (id && window.NormieState?.allMetadata?.[String(id)]) || window.NormieState?.alpha?.meta;
            const attrs = Array.isArray(meta?.attributes) ? meta.attributes : [];
            window.activeAlphaGender = (attrs.find(a => String(a.trait_type ?? '').toLowerCase() === 'gender')?.value ?? 'male').toLowerCase();
        };
        window.normieSpeak = function(text) {
            if (!window.NORMIE_VOICE_ENABLED) return;
            if (!window.electronAPI?.speakNormie) return;
            window.electronAPI.speakNormie(text, window.activeAlphaGender || 'male');
        };
        const WC_PROJECT_ID = '8e9d62f70ecd6a8c664107ad87c7caa1';
        const fmtWallet = addr => (!addr || addr.length < 10) ? addr : addr.slice(0, 6) + '...' + addr.slice(-4).toUpperCase();
        window.fmtWallet = fmtWallet;
        window.escapeHTML = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        // if (localStorage.getItem('devMode') === 'true') {
        //     document.getElementById('splash-screen').style.display = 'none';
        //     document.getElementById('desktop').style.display = 'block';
        //     document.getElementById('normie-dock').style.display = 'flex';
        //     window.currentWalletAddress = '0x8a8035f056af830b7205c58c1dc037f826fc2b92';
        //     window.NormieState = { address: '0x8a8035f056af830b7205c58c1dc037f826fc2b92', normieIds: [], allMetadata: {}, alpha: null };
        //     awaken('0x8a8035f056af830b7205c58c1dc037f826fc2b92');
        // } else {
        showSystemSplash(() => {
            const bootBar = document.getElementById('teaser-boot-bar');
            if (bootBar) bootBar.style.display = 'none';
            document.getElementById('splash-connect-btn').style.display = '';
            document.getElementById('dev-skip').style.display = '';
        });
        // }

        const appUrls = {
            canvas:  'https://canvas.normies.art/',
            minitel: 'https://minitel.normies.art/',
            market:  'https://blur.io/eth/collection/normies'
        };

        let zIndexCounter = 100;
        let wcClient = null;
        let matrixInterval = null;
        const startMenu = document.getElementById('start-menu');

        // ── Clock ────────────────────────────────────────────────────
        setInterval(() => {
            document.getElementById('clock').innerText =
                new Date().toLocaleTimeString('en-US', { hour12: false });
        }, 1000);

        // ── Terminal log ─────────────────────────────────────────────
        function log(msg) {
            const t = document.getElementById('boot-terminal');
            if (t) {
                let lines = t.innerText.split('\n').filter(l => l.trim() !== '');
                lines.push(msg);
                if (lines.length > 8) lines.shift();
                t.innerText = lines.join('\n');
            }
        }

        // ── Start menu — open/close helpers ─────────────────────────
        const smOpen  = () => {
            startMenu.classList.add('open');
            _smRefreshHeader();
            // Reset launcher to first tab
            const tabs = document.querySelectorAll('#launcher-tabs-bar .launcher-tab');
            if (tabs.length) {
                tabs.forEach(t => t.classList.remove('active'));
                tabs[0].classList.add('active');
                _launcherRenderSection(tabs[0].dataset.section);
            }
            document.getElementById('sm-search')?.focus();
        };
        const smClose = () => {
            startMenu.classList.remove('open');
            const s = document.getElementById('sm-search');
            if (s) { s.value = ''; _smSearchFilter(''); }
            _launcherHideTooltip();
        };

        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.classList.contains('open') ? smClose() : smOpen();
        });
        document.getElementById('desktop').addEventListener('click', smClose);

        // Escape closes, prevent bubbling from menu itself
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && startMenu.classList.contains('open')) smClose();
        });
        startMenu.addEventListener('click', e => e.stopPropagation());

        const osBtn = document.getElementById('sm-opensea-btn');
        if (osBtn) {
            osBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (typeof smClose === 'function') smClose();
                const body = createNativeWindow('OPENSEA', '');
                const win = body.closest('.os-window');
                if (win) { win.style.width = '1024px'; win.style.height = '720px'; }
                body.style.padding = '0';
                body.innerHTML = `<webview src="https://opensea.io/fr/collection/normies" style="width:100%;height:100%;border:none;background:#e3e5e4;" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"></webview>`;
            });
        }

        // ── Search filter ─────────────────────────────────────────────
        function _smSearchFilter(q) {
            const term = q.toLowerCase().trim();
            if (term) {
                _launcherRenderSection(null, term);
            } else {
                _launcherRenderSection(_launcher_activeSection);
            }
            // Pinned list (community apps)
            document.querySelectorAll('#sm-pinned-list .sm-app-btn').forEach(btn => {
                const name = btn.textContent.toLowerCase();
                btn.style.display = (!term || name.includes(term)) ? '' : 'none';
            });
            const pinnedCat = document.getElementById('sm-pinned-cat');
            if (pinnedCat) {
                const anyVisible = [...pinnedCat.querySelectorAll('.sm-app-btn')].some(b => b.style.display !== 'none');
                pinnedCat.style.display = (anyVisible && (pinnedCat.dataset.wasVisible || !term)) ? '' : 'none';
            }
        }
        document.getElementById('sm-search')?.addEventListener('input', e => _smSearchFilter(e.target.value));
        document.getElementById('sm-search')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const first = document.querySelector('#launcher-apps-grid .launcher-app-item');
                first?.click();
            }
            if (e.key === 'Escape') smClose();
            e.stopPropagation();
        });

        // ── Header refresh on open ────────────────────────────────────
        function _smRefreshHeader() {
            const persona   = window.currentAgentPersona;
            const nameEl    = document.getElementById('sm-agent-name');
            const prestEl   = document.getElementById('sm-prestige-val');
            const prestRow  = document.getElementById('sm-prestige-row');
            const countEl   = document.getElementById('sm-agent-count');

            if (persona?.name && nameEl) {
                nameEl.textContent = persona.name.toUpperCase();
                nameEl.style.display = '';
            }
            const prestige = window.walletPrestige;
            if (prestige != null && prestEl) {
                prestEl.textContent = Math.round(prestige);
                prestRow.style.display = '';
            }
            const agentCount = window.NormieState?.agents?.length;
            if (agentCount && countEl) countEl.textContent = `${agentCount} AGENTS`;
        }

        // ── Disconnect ───────────────────────────────────────────────
        document.getElementById('tour-btn').addEventListener('click', () => {
            localStorage.removeItem('normieOS_tour_v3');
            document.getElementById('start-menu').classList.remove('open');
            window.runGuidedTour();
        });

        document.getElementById('disconnect-btn').addEventListener('click', async () => {
            startMenu.classList.remove('open');
            if (wcClient) {
                try {
                    const sessions = Object.values(wcClient.session.getAll());
                    for (const s of sessions) await wcClient.disconnect({ topic: s.topic, reason: { code: 6000, message: 'User disconnected' } });
                } catch (_) {}
                wcClient = null;
            }
            clearInterval(_ollamaIntervalId);
            window.currentWalletAddress = null;
            updateStatusBits(0, 0);
            document.getElementById('boot-terminal').innerText = '';
            document.getElementById('desktop-normie').src = '';
            document.getElementById('sm-wallet').innerText = '';
            document.getElementById('splash-status').innerText = '';
            document.querySelectorAll('.os-window').forEach(w => w.remove());
            const bs = document.getElementById('alpha-build-screen');
            bs?.classList.remove('active');
            bs?.style.removeProperty('opacity');
            bs?.style.removeProperty('transition');
            document.getElementById('desktop')?.style.setProperty('display', 'none');
            document.getElementById('normie-dock')?.style.setProperty('display', 'none');
            // Reset splash : re-montrer éléments boot, cacher canvas
            ['splash-logo','splash-title','teaser-boot-bar'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = '';
            });
            document.getElementById('splash-connect-btn')?.style.setProperty('display', 'none');
            document.getElementById('alpha-canvas')?.style.setProperty('display', 'none');
            document.getElementById('alpha-build-label')?.style.setProperty('display', 'none');
            const splash = document.getElementById('splash-screen');
            splash?.classList.remove('fade-out');
            splash?.style.setProperty('display', 'flex');
            window.electronAPI?.disconnect?.();
        });

        // ── NormieState — single source of truth ────────────────────
        window.NormieState   = {
          utils: {
            getPiperPath: () => (typeof process !== 'undefined' && process.platform === 'linux')
              ? '/usr/local/bin/piper'
              : 'piper'
          },
          llmBypass: false
        };
        window.NormieStreams  = {};

        // ── Global Ollama network interceptor ─────────────────────────
        const _origFetch = window.fetch;
        window.fetch = async function(...args) {
            const url = args[0] instanceof Request ? args[0].url : args[0];
            if (window.NormieState?.llmBypass && typeof url === 'string' && url.includes('11434')) {
                return new Response(JSON.stringify({ response: 'AI disabled (Standby Mode)' }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }
            return _origFetch.apply(this, args);
        };

        // ── Text size init ────────────────────────────────────────────
        (function() {
            const savedSize = localStorage.getItem('normie-textsize') || 'medium';
            document.body.setAttribute('data-textsize', savedSize);
        })();

        const NormieCache = {
            get: (key) => {
                try {
                    const item = localStorage.getItem(`norms_${key}`);
                    if (!item) return null;
                    const { data, expires } = JSON.parse(item);
                    if (Date.now() > expires) { localStorage.removeItem(`norms_${key}`); return null; }
                    return data;
                } catch { return null; }
            },
            set: (key, data, ttlMs) => {
                try { localStorage.setItem(`norms_${key}`, JSON.stringify({ data, expires: Date.now() + ttlMs })); } catch {}
            }
        };
        window.NormieCache = NormieCache;
        const TTL = { TRAITS: 86400000, PERSONA: 3600000, CANVAS: 900000 };
        window.TTL = TTL;

        async function _showFirstBootOverlay() {
            if (localStorage.getItem('normieOS_tour_v3')) return;

            // Check if Ollama has at least one model loaded
            let aiReady = false;
            try {
                const res = await fetch('http://localhost:11434/api/tags', { signal: AbortSignal.timeout(2000) });
                if (res.ok) {
                    const data = await res.json();
                    aiReady = Array.isArray(data?.models) && data.models.length > 0;
                }
            } catch (_) { aiReady = false; }

            const overlay = document.createElement('div');
            overlay.id = 'tour-prompt';
            overlay.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10000;background:rgba(72,73,75,0.88);';
            const agentLabel = window.currentAgentPersona?.name
                ? `${window.currentAgentPersona.name} — #${window.currentAlphaId}`
                : `AGENT #${window.currentAlphaId ?? '?'}`;

            if (!aiReady) {
                overlay.innerHTML = `
                    <div style="background:#48494b;color:#e3e5e4;font-family:'Courier New',Courier,monospace;border:2px solid #e3e5e4;padding:28px 36px;text-align:center;max-width:420px;width:90%;">
                        <div style="font-size:11px;letter-spacing:2px;color:rgba(227,229,228,0.5);margin-bottom:8px;">${agentLabel}</div>

        // ── Awaken (post-WC) ─────────────────────────────────────────
        async function awaken(address) {
            window.sessionStart = window.sessionStart ?? Date.now();
            window.currentWalletAddress = address;
            const short = fmtWallet(address);
            const splashStatus = document.getElementById('splash-status');

            splashStatus.innerText = 'CHECKING OWNERSHIP...';

            try {
                const holdRes = await fetch(`${API}/holders/${address}`);
                const holdData = await holdRes.json();
                const tokenIds = holdData.tokenIds ?? holdData.ids ?? (Array.isArray(holdData) ? holdData : []);

                if (!Array.isArray(tokenIds) || tokenIds.length === 0) {
                    splashStatus.innerText = 'ACCESS DENIED: NO NORMIES FOUND';
                    return;
                }

                splashStatus.innerText = `${tokenIds.length} NORMIE(S) — ALPHA SCAN...`;

                const CACHE_KEY = `normie_boot_${address}`;
                const ALPHA_KEY = `normie_alpha_${address}`;
                const CACHE_TTL = 30 * 60 * 1000;

                // ── Seed allMetadata from cache ───────────────────────────────────
                const _raw     = (() => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } })();
                const _cacheOk = _raw && (Date.now() - (_raw.ts ?? 0)) < CACHE_TTL;
                let allMetadata = {};
                if (_cacheOk && _raw.allMetadata) allMetadata = { ..._raw.allMetadata };
                const _idsStr = tokenIds.map(String);

                // ── 429-aware fetch with retry (up to 3 attempts) ────────────────
                // Returns null on permanent failure → token excluded from election.
                const fetchMeta = async (id) => {
                    for (let attempt = 0; attempt < 3; attempt++) {
                        try {
                            const r = await fetch(`${API}/normie/${id}/metadata`);
                            if (r.status === 429) {
                                const wait = (parseInt(r.headers.get('Retry-After'), 10) || 2) * 1000;
                                console.warn(`[BOOT] 429 on #${id} — retry in ${wait}ms (attempt ${attempt + 1}/3)`);
                                await new Promise(ok => setTimeout(ok, wait));
                                continue;
                            }
                            if (!r.ok) { console.warn(`[BOOT] HTTP ${r.status} on #${id} — excluded from election`); return null; }
                            return await r.json();
                        } catch (e) { console.warn(`[BOOT] fetch error on #${id}:`, e?.message); return null; }
                    }
                    console.warn(`[BOOT] #${id} unresolved after 3 attempts — excluded from election`);
                    return null;
                };

                // ── Controlled-concurrency queue: 4 parallel slots, 100ms spacing ─
                const fetchQueue = async (ids) => {
                    let cursor = 0;
                    const worker = async () => {
                        while (cursor < ids.length) {
                            const id = ids[cursor++];
                            if (allMetadata[id]) continue;
                            const m = await fetchMeta(id);
                            if (m) { allMetadata[id] = m; NormieCache.set(`meta_${id}`, m, TTL.TRAITS); }
                            if (cursor < ids.length) await new Promise(ok => setTimeout(ok, 100));
                        }
                    };
                    await Promise.all(Array.from({ length: 4 }, worker));
                };

                // ── Fast path: validate saved alpha ───────────────────────────────
                const _savedAlpha = (() => { try { return localStorage.getItem(ALPHA_KEY); } catch { return null; } })();
                const _alphaKnown = _savedAlpha && _idsStr.includes(String(_savedAlpha));

                let mainId;
                let _bootBindings = null; // populated in discovery; loaded in background for fast paths

                if (_alphaKnown && allMetadata[String(_savedAlpha)]) {
                    // Fast path: alpha ID + metadata both cached — zero fetches
                    mainId = String(_savedAlpha);
                    splashStatus.innerText = `${tokenIds.length} NORMIE(S) — CACHE HIT`;
                } else if (_alphaKnown) {
                    // Alpha ID known but metadata missing — fetch just this one token
                    splashStatus.innerText = `SCANNING ALPHA #${_savedAlpha}...`;
                    const _am = await fetchMeta(String(_savedAlpha));
                    if (_am) allMetadata[String(_savedAlpha)] = _am;
                    mainId = String(_savedAlpha);
                } else {
                    // Discovery: fetch all metadata → one batch binding call → elect awakened alpha
                    splashStatus.innerText = `SCANNING ${tokenIds.length} ASSET(S)...`;
                    await fetchQueue(_idsStr);
                    splashStatus.innerText = 'CHECKING AGENT BINDINGS...';
                    try {
                        const _br = await fetch(`${API}/agents/binding/batch`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ tokenIds: _idsStr })
                        });
                        if (_br.ok) { const _bd = await _br.json(); _bootBindings = _bd.bindings ?? {}; }
                    } catch {}
                    const _bindings  = _bootBindings ?? {};
                    const _resolved  = _idsStr.filter(id => allMetadata[id]);
                    const _awakened  = _resolved.filter(id => _bindings[id]);
                    const _pool      = _awakened.length ? _awakened : _resolved; // fallback: all resolved
                    if (!_pool.length) throw new Error('NO METADATA RESOLVED — check API connectivity');
                    const _elected   = _pool
                        .map(id => ({ id, score: calculatePrestigeScore(allMetadata[id]) }))
                        .reduce((a, b) => b.score > a.score ? b : a);
                    mainId = String(_elected.id);
                    try { localStorage.setItem(ALPHA_KEY, mainId); } catch {}
                }

                const meta  = allMetadata[String(mainId)] ?? null;
                const attrs = Array.isArray(meta?.attributes) ? meta.attributes : [];
                const getA  = (key) => attrs.find(a => String(a.trait_type ?? '').toLowerCase() === key.toLowerCase())?.value ?? '?';

                // ── Fetch agents/info for elected alpha — 404 = dormant, never hangs
                splashStatus.innerText = `SCANNING ALPHA #${mainId}...`;
                let _bootPersona = null;
                try {
                    _bootPersona = await fetch(`${API}/agents/info/${mainId}`).then(r => r.ok ? r.json() : null).catch(() => null);
                } catch {}

                const alpha   = { id: mainId, meta, score: calculatePrestigeScore(meta) };
                const results = _idsStr.map(id => ({ id, score: calculatePrestigeScore(allMetadata[id]) }));

                window.currentAlphaId = mainId;
                window.allNormieIds   = tokenIds;
                window.NormieState = { address, normieIds: tokenIds, allMetadata, bindings: _bootBindings, alpha: { id: mainId, meta, score: alpha.score }, agents: null, burnStats: null, ollama: { online: false, model: localStorage.getItem('normie_model') || 'mistral:7b', installed: [], downloading: false, downloadModel: null } };
                window.cacheAlphaGender();
                window.walletPrestige = Math.round(results.map(r => r.score).sort((a, b) => b - a).slice(0, 5).reduce((s, x) => s + x, 0));
                const _pEl  = document.getElementById('sm-prestige-val');
                const _pRow = document.getElementById('sm-prestige-row');
                if (_pEl) { _pEl.textContent = window.walletPrestige; if (_pRow) _pRow.style.display = ''; }
                try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), tokenIds, allMetadata, alphaId: mainId })); } catch {}

                if (_bootPersona?.name) {
                    window.currentAgentPersona = _bootPersona;
                    NormieCache.set(`persona_${mainId}`, _bootPersona, TTL.PERSONA);
                    const nameEl = document.getElementById('sm-agent-name');
                    if (nameEl) { nameEl.textContent = _bootPersona.name.toUpperCase(); nameEl.style.display = ''; }
                }

                // ── Background: remaining metadata + bindings (fast paths) + agents + stats ──
                (async () => {
                    const _remaining = _idsStr.filter(id => !allMetadata[id]);
                    if (_remaining.length) {
                        await fetchQueue(_remaining);
                        window.NormieState.allMetadata = { ...allMetadata };
                        window.walletPrestige = Math.round(_idsStr.map(id => calculatePrestigeScore(allMetadata[id])).sort((a, b) => b - a).slice(0, 5).reduce((s, x) => s + x, 0));
                        if (_pEl) { _pEl.textContent = window.walletPrestige; if (_pRow) _pRow.style.display = ''; }
                        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), tokenIds, allMetadata, alphaId: mainId })); } catch {}
                    }
                    // Load bindings for apps if discovery path didn't already fetch them
                    if (!window.NormieState.bindings) {
                        try {
                            const _br = await fetch(`${API}/agents/binding/batch`, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ tokenIds: _idsStr })
                            });
                            if (_br.ok) { const _bd = await _br.json(); window.NormieState.bindings = _bd.bindings ?? {}; }
                        } catch {}
                    }
                    const [agentsData, stats] = await Promise.all([
                        fetch(`${API}/agents/list?sort=newest&limit=100`).then(r=>r.json()).catch(()=>null),
                        fetch(`${API}/history/stats`).then(r=>r.json()).catch(()=>null),
                    ]);
                    if (agentsData) { const all = Array.isArray(agentsData) ? agentsData : (agentsData.agents ?? agentsData.items ?? agentsData.data ?? []); window.NormieState.agents = all; NormieCache.set('agents', all, TTL.PERSONA); }
                    if (stats) window.NormieState.burnStats = stats;
                    window.dispatchEvent(new CustomEvent('normiestate:alpha-updated', { detail: window.NormieState.alpha }));
                })();

                const imgUrl      = meta?.image ?? `${API}/normie/${mainId}/image.png`;
                const splash      = document.getElementById('splash-screen');
                const buildCanvas = document.getElementById('alpha-canvas');

                // ISO TEST MODE — full alpha build animation enabled
                ['splash-logo','splash-title','teaser-boot-bar','splash-connect-btn','splash-status'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
                const buildLabel = document.getElementById('alpha-build-label');
                buildLabel.innerText = `>> BUILDING ALPHA #${mainId}...`;
                buildLabel.style.display = '';
                buildCanvas.style.display = 'block';
                try {
                    await animateAlphaBuild(imgUrl, buildCanvas);
                } catch {}
                splash.style.display = 'none';
                document.getElementById('desktop').style.display = 'block';
                document.getElementById('normie-dock').style.display = 'flex';
                toggleWallpaper(localStorage.getItem('wallpaperMode') || 'normie');

                // Bureau
                document.getElementById('sm-wallet').innerText = short;
                document.getElementById('desktop-normie').src = imgUrl;

                window.currentAlphaLevel = Number(getA('Level')) || 0;
                window.currentAlphaAP    = Number(getA('Action Points')) || 0;
                updateStatusBits(window.currentAlphaLevel, window.currentAlphaAP);

                if (window._normieGuard) window._normieGuard.stop();
                if (window._activityWatcher) window._activityWatcher.stop();
                import('./mempool-monitor.js').then(({ NormieGuard, NormiesActivityWatcher, showMempoolAlert }) => {
                    const guard = new NormieGuard(address, 'https://api.normies.art');
                    guard.onAlert(alert => {
                        if (alert.type === 'NFT_GONE') {
                            showMempoolAlert({
                                contract: 'ERC-721C',
                                method: '!! NORMIE #' + alert.tokenId + ' MISSING FROM WALLET',
                                from: address,
                                hash: 'verify on opensea'
                            });
                        }
                    });
                    guard.start();
                    window._normieGuard = guard;

                    const watcher = new NormiesActivityWatcher();
                    watcher.start();
                    window._activityWatcher = watcher;
                    window._normiesWatcher  = watcher;

                    // One-time Piper check
                    if (window.electronAPI?.checkPiper && !sessionStorage.getItem('_piperChecked')) {
                        sessionStorage.setItem('_piperChecked', '1');
                        window.electronAPI.checkPiper().then(r => {
                            if (r !== 'found') notifier.showNotif('TTS', 'PIPER TTS NOT INSTALLED — run: pip install piper-tts', null);
                        }).catch(() => {});
                    }

                    watcher.onActivity(async (event) => {
                        const model = window.NormieState?.ollama?.model ?? window.OLLAMA_MODEL ?? 'mistral:7b';
                        const agentName = window.currentAgentPersona?.name ?? `#${window.currentAlphaId}`;

                        let prompt = '';
                        if (event.type === 'BURN')      prompt = `You are ${agentName}, a Normies agent. ${event.delta} Normie(s) were just burned on Ethereum. React in 1 sentence, in character.`;
                        if (event.type === 'AGENT')     prompt = `You are ${agentName}. A new Normies agent just awakened on-chain. React in 1 sentence, in character.`;
                        if (event.type === 'TRANSFORM') prompt = `You are ${agentName}. A Normie canvas was just edited on-chain. React in 1 sentence, in character.`;

                        if (event.type === 'BURN')      notifier.showNotif('ASHFALL', `Burn detected — ${event.delta} token(s) burned`, 'burnwatch');
                        if (event.type === 'AGENT')     notifier.showNotif('HIVE', `NEW AGENT`, 'hive');
                        if (event.type === 'TRANSFORM') notifier.showNotif('CANVAS', `Canvas edit detected on-chain`, 'pixelforge');

                        if (!prompt) return;

                        try {
                            const res = await fetch('http://localhost:11434/api/generate', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ model, prompt, stream: false, options: { num_predict: 60 } })
                            });
                            const data = await res.json();
                            const msg = data.response?.trim();

                            window.showNormieBubble?.(msg, agentName);
                            // Piper TTS — speak only if voice enabled
                            if (window.NORMIE_VOICE_ENABLED && window.electronAPI?.speakNormie) {
                                window.electronAPI.speakNormie(msg, window.activeAlphaGender).catch(() => {});
                            }
                        } catch {}
                    });
                });

                fetchAgentsCount().then(count => {
                    const el = document.getElementById('emergence-counter');
                    if (el) el.textContent = `[ ${count} AGENTS ]`;
                }).catch(() => {
                    const el = document.getElementById('emergence-counter');
                    if (el) el.textContent = `[ AGENTS ]`;
                });

                log(`>> IDENTITY MAPPING: ${short}`);
                log(`>> ALPHA DETECTED: #${mainId} | PRESTIGE: ${alpha.score}`);
                log(`>> STATUS: LVL ${getA('Level')} | AP: ${getA('Action Points')}`);


            } catch (err) {
                splashStatus.innerText = `ERROR: ${err.message}`;
            }
        }

        function pinAppToDock(app) {
            if (pinnedApps.has(app.id)) return;

            const icon = document.createElement('button');
            icon.className = 'dock-pinned-icon';
            icon.dataset.pinnedId = app.id;
            icon.title = app.name;
            icon.innerHTML = `<img src="${app.thumbnailUrl}" alt="${app.name}" onerror="this.src=''">`;

                body.innerHTML = `<iframe src="${app.url}" style="width:100%;height:100%;border:none;"></iframe>`;
            });
            document.getElementById('dock-apps').appendChild(icon);
            pinnedApps.set(app.id, { icon });
            savePinnedToStorage();
            renderStartMenuApps();
        }

        function unpinAppFromDock(appId) {
            const entry = pinnedApps.get(appId);

            entry.icon.remove();
            pinnedApps.delete(appId);
            savePinnedToStorage();
            renderStartMenuApps();
        }

        function createNativeWindow(title, content, nativeKey) {
            // Focus existing window by data-native key or title

        function _wpLoop() {
            const canvas = document.getElementById('mempool-wallpaper');
            if (!canvas || canvas.style.display === 'none') { _wpRaf = null; return; }
            const ctx = canvas.getContext('2d');
            const now = performance.now();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = _wpPixels.length - 1; i >= 0; i--) {
                const p = _wpPixels[i];
                const age = (now - p.born) / 3000;
                if (age >= 1) { _wpPixels.splice(i, 1); continue; }
                ctx.fillStyle = `rgba(72,73,75,${(p.alpha * (1 - age)).toFixed(3)})`;

        let _hwRafId = null;
        let _hwDots  = [];

        function _hwTidHash(tid) {
            return String(tid).split('').reduce((h, c) => ((h * 31 + c.charCodeAt(0)) & 0xFFFF), 0);
        }

        function _hwGenerateSeedDots() {
            const alphaId = String(window.NormieState?.alpha?.id ?? '6594');
            const wallet  = String(window.NormieState?.address ?? '0x8a8035f056af830b7205c58c1dc037f826fc2b92');
            const seedStr = alphaId + wallet.slice(-8);
            let seed = seedStr.split('').reduce((h, c) => ((h * 31 + c.charCodeAt(0)) | 0), 0);
            const rand = () => {
                seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
            const types = ['human', 'cat', 'alien', 'unknown'];
            const dots  = [{ tid: alphaId, type: 'human', lvl: 2, isAlpha: true }];
            for (let i = 0; i < 59; i++) {
                dots.push({
                    tid:  String(Math.floor(rand() * 8999) + 1000),
                    type: types[Math.floor(rand() * 4)],
                    lvl:  Math.floor(rand() * 5),
                });
            }
            return dots;
        }
        // Knuth multiplicative hash — identique à hive.js dotPos
        function _hwDotPos(dot, cw, ch) {
            const tid = Number(dot.tid) || _hwTidHash(dot.tid);
            return {
                x: ((tid * 2654435761) >>> 0) % (cw - 20) + 10,
                y: ((tid * 2246822519) >>> 0) % (ch - 20) + 10
            };
        }

        // Dots activés par le MempoolMonitor (pulse fort)
        const _hwActiveTids = new Set();
        function _hwOnActivity() {
            if (!_hwDots.length) return;
            const idx = Math.floor(Math.random() * _hwDots.length);
            const tid = _hwDots[idx].tid;
            _hwActiveTids.add(tid);
            setTimeout(() => _hwActiveTids.delete(tid), 2000);
        }

        function startHiveWallpaper() {
            const canvas = document.getElementById('hive-wallpaper');
            if (!canvas) return;
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.opacity = '1';
            if (_hwRafId) return;
            const raw = window.NormieState?.agents ?? [];
            _hwDots = raw.map(a => ({
                tid:  String(a.tokenId ?? a.token_id ?? a.id ?? ''),
                type: String(a.type ?? a.agentType ?? 'unknown').toLowerCase(),
                lvl:  Number(a.level ?? a.lvl ?? 0)
            })).filter(d => d.tid);
            if (!_hwDots.length) _hwDots = _hwGenerateSeedDots();
            const t0 = performance.now();
            const frame = now => {
                const c = document.getElementById('hive-wallpaper');
                if (!c || c.style.opacity === '0') { _hwRafId = null; return; }
                if (!_hwDots.length) {
                    const live = window.NormieState?.agents ?? [];
                    _hwDots = live.length
                        ? live.map(a => ({ tid: String(a.tokenId ?? a.token_id ?? a.id ?? ''), type: String(a.type ?? a.agentType ?? 'unknown').toLowerCase(), lvl: Number(a.level ?? a.lvl ?? 0) })).filter(d => d.tid)
                        : _hwGenerateSeedDots();
                }
                const t   = (now - t0) / 1000;
                const ctx = c.getContext('2d');
                const cw  = c.width, ch = c.height;
                ctx.clearRect(0, 0, cw, ch);

                // Pré-calcul positions (identique NETWORK tab)
                const dotData = _hwDots.map(dot => {
                    const h       = _hwTidHash(dot.tid);
                    const pos     = _hwDotPos(dot, cw, ch);
                    const phase   = ((h & 0xFF) / 255) * Math.PI * 2;
                    const speed   = 0.3 + ((h >> 8) & 0xFF) / 600;
                    const isActive = _hwActiveTids.has(dot.tid);
                    const isAlpha  = !!dot.isAlpha;
                    const pulse   = Math.abs(Math.sin(t * speed + phase));
                    return { pos, pulse, lvl: dot.lvl, isAlpha, isActive };
                });

                // Lignes de connexion — max 45px (identique NETWORK tab)
                ctx.lineWidth = 1;
                const maxDist = 45, maxDistSq = maxDist * maxDist;
                for (let i = 0; i < dotData.length; i++) {
                    for (let j = i + 1; j < dotData.length; j++) {
                        const dx = dotData[i].pos.x - dotData[j].pos.x;
                        const dy = dotData[i].pos.y - dotData[j].pos.y;
                        const dSq = dx * dx + dy * dy;
                        if (dSq < maxDistSq) {
                            const op = 0.15 * (1 - Math.sqrt(dSq) / maxDist);
                            ctx.strokeStyle = `rgba(72,73,75,${op.toFixed(3)})`;
                            ctx.beginPath();
                            ctx.moveTo(dotData[i].pos.x, dotData[i].pos.y);
                            ctx.lineTo(dotData[j].pos.x, dotData[j].pos.y);
                            ctx.stroke();
                        }
                        if (j - i > 40) break;
                    }
                }

                // Nœuds carrés fillRect (identique NETWORK tab)
                for (const d of dotData) {
                    const size   = (d.isAlpha || d.isActive) ? 3 : 2;
                    const opacity = d.isAlpha
                        ? (0.9 + 0.1 * d.pulse)
                        : d.isActive
                            ? (0.75 + 0.25 * d.pulse)
                            : (0.5 + 0.5 * d.pulse);
                    ctx.fillStyle = `rgba(72,73,75,${opacity.toFixed(3)})`;
                    ctx.fillRect(d.pos.x, d.pos.y, size, size);
                    if (d.isAlpha || d.isActive) {
                        ctx.strokeStyle = `rgba(72,73,75,${(opacity * 0.5).toFixed(3)})`;
                        ctx.lineWidth = 1;
                        ctx.strokeRect(d.pos.x - 1, d.pos.y - 1, size + 2, size + 2);
                    }
                }
                _hwRafId = requestAnimationFrame(frame);
            };
            _hwRafId = requestAnimationFrame(frame);
        }

        // ── NATIVE APPS DATA ─────────────────────────────────────────
        const NATIVE_APPS = [
            { native:'inventory',     name:'VAULT',      icon:'inventory',     desc:'your collection',         section:'INTEL' },

        // ── COSMIC LAUNCHER ──────────────────────────────────────────
        let _launcher_activeSection = 'INTEL';
        let _launcher_dragSrc = null;

        function _launcherMakeItem(app) {
            const btn = document.createElement('button');
            btn.className = 'sm-app-btn launcher-app-item';
            btn.dataset.native  = app.native;
            btn.dataset.icon    = app.icon;
            btn.dataset.desc    = app.desc;
            btn.dataset.section = app.section;
            if (app.id) btn.id = app.id;

            const iconInner     = SVG_ICONS[app.icon] || '';
            let agentsCount = '--';
            if (window._normiesWatcher && window._normiesWatcher._snapshot && window._normiesWatcher._snapshot.count) {
                agentsCount = window._normiesWatcher._snapshot.count;
            } else if (window.NormieState && window.NormieState.agents && window.NormieState.agents.length) {
                agentsCount = window.NormieState.agents.length;
            }
            const emergCounter = app.native === 'emergence'
                ? `<span id="emergence-counter" style="font-size:10px;letter-spacing:0.5px;display:block;">[ ${agentsCount} / 1500 ]</span>`
                : '';

            btn.innerHTML = `<span class="sm-icon-wrap" style="width:40px;height:40px;"><svg class="sm-icon" style="width:40px;height:40px;" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${iconInner}</svg></span><span class="launcher-app-name">${app.name}</span>${emergCounter}`;

            // Drag to reorder within section
            btn.draggable = true;
            btn.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', app.native + '|' + app.name);
                btn.classList.add('dragging');
                _launcher_dragSrc = btn;
            });
            btn.addEventListener('dragend', () => { btn.classList.remove('dragging'); _launcher_dragSrc = null; });
            btn.addEventListener('dragover', e => e.preventDefault());
            btn.addEventListener('drop', e => {
                e.preventDefault();
                if (_launcher_dragSrc && _launcher_dragSrc !== btn && !e.dataTransfer.getData('text/plain').startsWith('__desktop__')) {
                    const grid = document.getElementById('launcher-apps-grid');
                    const items = [...grid.querySelectorAll('.launcher-app-item')];
                    const srcIdx = items.indexOf(_launcher_dragSrc);
                    const dstIdx = items.indexOf(btn);
                    if (srcIdx < dstIdx) btn.after(_launcher_dragSrc);
                    else btn.before(_launcher_dragSrc);
                    _launcherSaveOrder(_launcher_activeSection);
                }
            });

            btn.addEventListener('mouseenter', e => _launcherShowTooltip(app.desc, e));
            btn.addEventListener('mousemove',  e => _launcherMoveTooltip(e));
            btn.addEventListener('mouseleave', _launcherHideTooltip);

            btn.addEventListener('click', () => {
                window._smLastIcon = app.icon;
                window._notifier?._clearBadge(app.native);
                const fn = APP_LAUNCHERS[app.native];
                if (fn) { smClose(); fn(); }
            });
            return btn;
        }

        function _launcherSaveOrder(section) {
            const grid = document.getElementById('launcher-apps-grid');
            if (!grid) return;
            const order = [...grid.querySelectorAll('.launcher-app-item')].map(b => b.dataset.native);
            localStorage.setItem(`normie_launcher_order_${section}`, JSON.stringify(order));
        }

        function _launcherRenderSection(section, searchTerm) {
            const grid = document.getElementById('launcher-apps-grid');
            if (!grid) return;
            grid.innerHTML = '';
            let apps;
            if (searchTerm) {
                const t = searchTerm.toLowerCase();
                apps = NATIVE_APPS.filter(a => a.name.toLowerCase().includes(t) || a.desc.toLowerCase().includes(t));
            } else {
                _launcher_activeSection = section;
                const saved = JSON.parse(localStorage.getItem(`normie_launcher_order_${section}`) || 'null');
                apps = NATIVE_APPS.filter(a => a.section === section);
                if (saved) {
                    apps = [...apps].sort((a, b) => {
                        const ia = saved.indexOf(a.native), ib = saved.indexOf(b.native);
                        return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
                    });
                }
            }
            apps.forEach(app => grid.appendChild(_launcherMakeItem(app)));
        }

        function _launcherBuildTabs() {
            const bar = document.getElementById('launcher-tabs-bar');
            if (!bar) return;
            bar.innerHTML = '';
            const sections = [...new Set(NATIVE_APPS.map(a => a.section))];
            sections.forEach((sec, i) => {
                const tab = document.createElement('button');
                tab.className = 'launcher-tab' + (i === 0 ? ' active' : '');
                tab.textContent = sec;
                tab.dataset.section = sec;
                tab.addEventListener('click', () => {
                    bar.querySelectorAll('.launcher-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    _launcherRenderSection(sec);
                });
                bar.appendChild(tab);
            });
        }

        function _launcherShowTooltip(desc, e) {
            const tt = document.getElementById('launcher-tooltip');
            if (!tt || !desc) return;
            tt.textContent = desc;
            tt.style.display = 'block';
            _launcherMoveTooltip(e);
        }
        function _launcherMoveTooltip(e) {
            const tt = document.getElementById('launcher-tooltip');
            if (!tt || tt.style.display === 'none') return;
            tt.style.left = (e.clientX + 12) + 'px';
            tt.style.top  = (e.clientY - 32) + 'px';
        }
        function _launcherHideTooltip() {
            const tt = document.getElementById('launcher-tooltip');
            if (tt) tt.style.display = 'none';
        }

        function _launcherInit() {
            _launcherBuildTabs();
            if (NATIVE_APPS[0]) _launcherRenderSection(NATIVE_APPS[0].section);
        }

        window.launchNativeApp = native => {
            const meta = NATIVE_APPS.find(a => a.native === native);
            if (meta) window._smLastIcon = meta.icon;
            const fn = APP_LAUNCHERS[native];
            if (fn) fn();
        };

        function updateStatusBits(level, ap) {
            const bits = document.querySelectorAll('#sm-level-bits .sm-bit');
            const lvl  = Math.min(63, Math.max(0, Number(level) || 0));
            bits.forEach((b, i) => b.classList.toggle('on', !!((lvl >> (5 - i)) & 1)));
            const lvlEl = document.getElementById('sm-level-val');
            if (lvlEl) lvlEl.innerText = level ?? '--';

            const apBar = document.getElementById('sm-ap-bar');
            if (apBar) {
                apBar.innerHTML = '';
                const filled = Math.min(10, Math.round((Number(ap) / 20) * 10));
                for (let i = 0; i < 10; i++) {
                    const px = document.createElement('span');
                    px.className = 'sm-ap-px' + (i < filled ? ' on' : '');
                    apBar.appendChild(px);
                }
            }
            const apEl = document.getElementById('sm-ap-val');
            if (apEl) apEl.innerText = ap ?? '--';
        }


        // ── App dispatch table — O(1) lookup, no if-else chain ───────
        const APP_LAUNCHERS = {
            burnwatch:     () => openBurnWatch(),
            inventory:     () => openInventory(),
            portfolio:     () => openPortfolio(),
            appdirectory:  () => openAppDirectory(),
            braininspector:() => window.openBrainInspector?.(),
            awakening:     () => openAwakening(),
            hive:          () => window.openHive?.(),
            retro:         () => window.openRetro?.(),
            minesweeper:   () => window.openMinesweeper?.(),
            terminal:      () => openTerminal(),
            pixeleditor:   () => openPixelEditor(),
            walletorch:    () => openWalletOrchestrator(),
            arena:         () => window.openCombat?.(),
            simulator:     () => openArenaSimulator(),
            alphaswitch:   () => openAlphaSwitch(),
            controlpanel:  () => openControlPanel(),
            normieguard:   () => openNormieGuard(),
            vinyl:         () => openVinyl(),
            emergence:     () => window.openEmergence?.(),
            trash:         () => window.openTrash?.(),
            notepad:       () => openNotepad(),
            tools:         () => openTools(),
            navigateur:    () => window.openNavigateur?.(),
            marketpulse:   () => window.openMarketPulse?.(),
            leaderboard:   () => createNativeWindow('LEADERBOARD', '<div class="native-loading">>> PHASE 3 — COMING SOON</div>'),
        };


        function getAppType(app) {
            if (app.url.includes('editor.p5js.org')) return 'p5js';
            if (app.url.match(/\.pdf$/i))            return 'pdf';
            return 'remote';
        }

        function getLocalPath(app) {
            const type = getAppType(app);
            if (type === 'p5js') return `./internal-apps/p5-${app.id}.html`;
            if (type === 'pdf')  return `./internal-apps/drawyournormie.pdf`;
            return null;
        }

        function makeAppBtn(app) {
            const type  = getAppType(app);
            const local = getLocalPath(app);
            const badge = type === 'p5js' ? '[P5JS]' : type === 'pdf' ? '[LOCAL]' : '[REMOTE]';
            const btn = document.createElement('button');
            btn.className = 'sm-app-btn';
            btn.innerHTML = `▸ ${app.name.toUpperCase()} <span style="font-size:10px;opacity:0.6;">${badge}</span>`;
            btn.addEventListener('click', () => {
                document.getElementById('start-menu').classList.remove('open');
                const body = createNativeWindow(app.name.toUpperCase(), '');
                const win = body.closest('.os-window');
                if (win) { win.style.width = '900px'; win.style.height = '600px'; }
                body.style.padding = '0';
                const src = local ?? app.url;
                body.innerHTML = `<iframe src="${src}" style="width:100%;height:100%;border:none;" allowfullscreen></iframe>`;
            });
            return btn;
        }

        function renderStartMenuApps() {
            const pinnedList = document.getElementById('sm-pinned-list');
            const pinnedCat  = document.getElementById('sm-pinned-cat');
            if (!pinnedList) return;

            pinnedList.innerHTML = '';
            const pinnedIds = [...pinnedApps.keys()];
            if (pinnedIds.length > 0) {
                pinnedCat.style.display = '';
                pinnedIds.forEach(id => {
                    const app = APPS.find(a => a.id === id);
                    if (app) pinnedList.appendChild(makeAppBtn(app));
                });
            } else {
                pinnedCat.style.display = 'none';
            }
        }

        _launcherInit();
        loadPinnedFromStorage();
        renderStartMenuApps();

        // ── Notification Log ─────────────────────────────────────────
        const _logBtn   = document.getElementById('notif-log-btn');
        const _logPanel = document.getElementById('notif-log-panel');
        const _logBadge = document.getElementById('notif-log-badge');

        function _fmtTime(ts) {
            const d = new Date(ts);
            return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + ':' + d.getSeconds().toString().padStart(2,'0');
        }

        function _renderLogPanel() {
            const entries = window._notifLog || [];
            if (!entries.length) {
                _logPanel.innerHTML = '<div style="padding:10px;opacity:0.6;">[ NO NOTIFICATIONS ]</div>';
                return;
            }
            _logPanel.innerHTML = entries.map((e, i) => `
                <div data-log-idx="${i}" style="padding:6px 10px;border-bottom:1px solid rgba(227,229,228,0.15);cursor:${e.appTarget ? 'pointer' : 'default'};">
                    <span style="opacity:0.55;">${_fmtTime(e.timestamp)}</span>
                    <span style="margin-left:6px;font-weight:bold;letter-spacing:1px;">[${e.type}]</span>
                    <span style="margin-left:4px;">${e.message}</span>
                    ${e.appTarget ? `<span style="opacity:0.5;margin-left:4px;">&gt;</span>` : ''}
                </div>`).join('');
            _logPanel.querySelectorAll('[data-log-idx]').forEach(row => {
                const idx = Number(row.dataset.logIdx);
                const entry = entries[idx];
                if (entry?.appTarget) {
                    row.addEventListener('click', () => {
                        const btn = document.querySelector(`.sm-app-btn[data-native="${entry.appTarget}"]`);
                        if (btn) btn.click();
                        _logPanel.style.display = 'none';
                    });
                }
            });
        }

        function _updateLogBadge() {
            const n = window._notifUnread || 0;
            _logBadge.style.display = n > 0 ? 'block' : 'none';
            _logBadge.textContent   = n > 9 ? '9+' : String(n);
        }

        window._onNewNotif = _updateLogBadge;

        _logBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = _logPanel.style.display !== 'none';
            if (open) {
                _logPanel.style.display = 'none';
            } else {
                _renderLogPanel();
                _logPanel.style.display = 'block';
                window._notifUnread = 0;
                _updateLogBadge();
            }
        });

        document.addEventListener('click', (e) => {
            if (!_logPanel.contains(e.target) && e.target !== _logBtn) {
                _logPanel.style.display = 'none';
            }
        });

        // ── Normie Speech Bubble ──────────────────────────────────────
        window.showSpeechBubble = function(text, agentName) {
            const bubble = document.getElementById('normie-bubble');
            if (!bubble) return;
            clearTimeout(bubble._dismissTimer);
            bubble.innerHTML = (agentName
                ? `<div style="font-weight:bold;letter-spacing:1px;margin-bottom:4px;">${agentName.toUpperCase()}</div>` : '')
                + `<div>${text}</div>`;
            // Show immediately at opacity 0 so offsetHeight is calculable
            bubble.style.display    = 'block';
            bubble.style.opacity    = '0';
            bubble.style.transition = 'none';
            requestAnimationFrame(() => {
                bubble.style.left = 'calc(50vw + 13vh)';
                bubble.style.top  = 'calc(50vh - 40vh)';
                bubble.style.opacity = '1';
                bubble._dismissTimer = setTimeout(() => {
                    bubble.style.transition = 'opacity 500ms';
                    bubble.style.opacity    = '0';
                    setTimeout(() => { bubble.style.display = 'none'; }, 520);
                }, 7000);
            });
        };
        window.showNormieBubble = window.showSpeechBubble; // alias

        // Repositionne la bulle en direct si l'écran change de taille (ex: fermeture DevTools)
        window.addEventListener('resize', () => {
            const bubble = document.getElementById('normie-bubble');
            if (bubble && bubble.style.display === 'block') {
                bubble.style.left = 'calc(50vw + 13vh)';
                bubble.style.top  = 'calc(50vh - 40vh)';
            }
        });
